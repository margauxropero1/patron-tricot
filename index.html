function renderInteractiveGrid(p, c, tr){
  var grid = c.grid;
  var editing = state.chartEditCells === c.id;
  var trackers = getTrackers(c);
  var curRow = tr.row || 1;
  var rowNumbers = [];
  for (var i = grid.rows; i >= 1; i--) rowNumbers.push(i);
  var wrap = el("div", {}, []);
  var scroll = el("div", {class:"chart-scroll"}, []);
  rowNumbers.forEach(function(r){
    var cells = grid.cells[r-1] || [];
    var hasNote = grid.notes && grid.notes[String(r)];
    var offRow = r > chartRepeat(c);
    var rowClass = "chart-row" + (curRow === r ? " current" : "") + (r < curRow ? " done" : "") + (offRow ? " off" : "");
    var cellEls = cells.map(function(sym, ci){
      return el("div", {
        class: "chart-cell chart-cell-" + sym,
        onclick: editing ? function(e){ e.stopPropagation(); cycleCell(p, c, r-1, ci); } : null
      });
    });
    var others = trackers.filter(function(t){ return t.id !== tr.id && (t.row || 1) === r; })
      .map(function(t){ return el("span", {class:"chart-tag"}, [t.name]); });
    scroll.appendChild(el("div", {
      class: rowClass,
      title: editing ? "" : "Taper : rang " + r + " fait",
      onclick: (editing || offRow) ? null : function(){ markRowDone(p, c, tr.id, r); }
    }, [
      el("div", {class:"chart-rownum"}, [String(r)]),
      el("div", {class:"chart-cells"}, cellEls),
      hasNote ? el("div", {class:"chart-note-dot", title: grid.notes[String(r)]}) : null
    ].concat(others)));
  });
  var colNums = [];
  for (var cn = grid.cols; cn >= 1; cn--) colNums.push(el("div", {class:"chart-colnum"}, [String(cn)]));
  scroll.appendChild(el("div", {class:"chart-row chart-foot"}, [
    el("div", {class:"chart-rownum"}, [""]),
    el("div", {class:"chart-cells"}, colNums)
  ]));
  wrap.appendChild(scroll);

  // Bring the current row into view once per position change, not on every render.
  var key = c.id + ":" + tr.id + ":" + curRow;
  if (state.lastScrollKey !== key){
    state.lastScrollKey = key;
    setTimeout(function(){
      var cur = scroll.querySelector(".chart-row.current");
      if (cur) scroll.scrollTop = Math.max(0, cur.offsetTop - scroll.clientHeight / 2);
    }, 0);
  }

  wrap.appendChild(el("div", {class:"small-note", style:"margin-top:6px;"}, [
    editing ? "Mode correction : tape une case pour passer endroit → envers → torsade." : "Tape un rang quand tu l'as tricoté : le repère passe au rang suivant. Lecture sur l'endroit : de droite à gauche, de bas en haut."
  ]));
  var legend = el("div", {class:"chart-legend", style:"margin-top:6px;"}, []);
  legend.appendChild(el("span", {}, [el("span", {class:"sw"}), "endroit"]));
  legend.appendChild(el("span", {}, [el("span", {class:"sw", style:"background:var(--ink);border-radius:50%;width:8px;height:8px;display:inline-block;vertical-align:-1px;margin-right:4px;"}), "envers"]));
  legend.appendChild(el("span", {}, [el("span", {class:"sw", style:"background:var(--highlight);"}), "torsade / spécial (voir note)"]));
  wrap.appendChild(legend);
  return wrap;
}

function cycleCell(p, c, rowIndex, colIndex){
  var order = ["k", "p", "x"];
  var res = cloneChartsWithTarget(p, c.id);
  if (!res.target) return;
  var cur = res.target.grid.cells[rowIndex][colIndex];
  res.target.grid.cells[rowIndex][colIndex] = order[(order.indexOf(cur) + 1) % order.length];
  p.charts = res.charts;
  persistCharts(p);
  render();
}

// Chart objects can come straight from a frozen db snapshot — never mutate
// them in place. Clone the whole charts array (deeply, via JSON) and hand
// back the matching (now-extensible) object to mutate instead.
function cloneChartsWithTarget(p, chartId){
  var charts = JSON.parse(JSON.stringify(p.charts || []));
  var target = null;
  for (var i = 0; i < charts.length; i++){ if (charts[i].id === chartId){ target = charts[i]; break; } }
  return { charts: charts, target: target };
}

function persistCharts(p){
  var ref = currentRef();
  if (ref) queueWrite(function(){
    var clean = (p.charts || []).map(function(c){ var copy = Object.assign({}, c); delete copy._busy; delete copy._error; delete copy._notesBusy; delete copy._sizeBusy; return copy; });
    return ref.update({ charts: clean, updatedAt: new Date().toISOString() });
  }).catch(function(e){ console.error(e); });
}

function assetIdToBlob(imageId){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){
      try{
        var canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth || 800;
        canvas.height = img.naturalHeight || 800;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        canvas.toBlob(function(blob){
          if (blob) resolve(blob); else reject(new Error("toBlob a échoué"));
        }, "image/png");
      } catch(e){ reject(e); }
    };
    img.onerror = function(){ reject(new Error("impossible de recharger l'image enregistrée")); };
    img.src = "/_blob/" + imageId;
  });
}

var CHART_NOTE_RULE = "Pour chaque note : indique d'abord les mailles concernées (numéros de colonnes tels qu'affichés sous la grille, la colonne 1 étant tout à droite), "
  + "puis reprends MOT POUR MOT, dans la langue d'origine du patron, l'explication que le patron donne pour ce symbole (légende, abréviations ou paragraphe "
  + "qui explique les torsades / points spéciaux), précédée de son nom s'il en a un (ex : « C8F : Place 4 sts onto a cable needle in front of the work... »). "
  + "Ne reformule pas, ne traduis pas et n'invente aucune technique. Si le patron n'explique pas ce symbole, décris seulement le symbole tel qu'il est dessiné, en une phrase.";

function patternTextForCharts(raw){
  raw = String(raw || "");
  if (!raw.trim()) return "";
  return "\n\n--- TEXTE DU PATRON (pour retrouver la légende et l'explication exacte des symboles) ---\n" + raw.slice(0, 30000);
}

function chartGridPrompt(hints){
  var hint = "";
  if (hints && hints.name) hint += " Il s'agit de la grille « " + hints.name + " ».";
  if (hints && hints.rows) hint += " La grille fait environ " + hints.rows + " rangs de haut.";
  if (hints && hints.cols) hint += " Elle fait environ " + hints.cols + " mailles de large.";
  var sizeRule = "";
  if (hints && hints.size){
    sizeRule = "\n\nHauteur selon la taille : la tricoteuse fait la taille « " + hints.size.label + " »"
      + (hints.size.count > 1 ? " (position " + (hints.size.index + 1) + " sur " + hints.size.count + " dans les séquences entre parenthèses du patron)" : "")
      + ". Si la hauteur de la répétition dépend de la taille (ex : « 52 (52) 54 (54) 56 (56) rows » dans le texte, ou repères de taille dessinés sur la grille), "
      + "mets dans \"repeatRows\" le nombre de rangs de la répétition pour CETTE taille ; sinon repeatRows = rows. \"rows\" et \"cells\" décrivent toujours la grille entière dessinée.";
  }
  return "Voici l'image d'une grille (chart) de tricot." + hint + " L'image peut contenir d'autres éléments autour (texte, légende, autre grille) : ne convertis que cette grille-là. Convertis-la en une grille de cases structurée, case par case.\n\n"
    + "Utilise UNIQUEMENT ces 3 types de case :\n"
    + "- \"k\" : maille endroit sur l'endroit (case vide sur le diagramme)\n"
    + "- \"p\" : maille envers sur l'endroit (case avec un point sur le diagramme)\n"
    + "- \"x\" : toute case impliquée dans une manœuvre spéciale (croisement de torsade/câble, augmentation, diminution, jeté, pas de maille, etc.)\n\n"
    + "Si la légende du patron utilise d'autres symboles pour l'endroit et l'envers, applique-la. "
    + "La première ligne du tableau \"cells\" (index 0) doit correspondre au rang 1, tout en bas de la grille. Chaque ligne doit avoir exactement "
    + "\"cols\" éléments, dans l'ordre de lecture du diagramme sur l'endroit (de droite à gauche tel qu'affiché, mais stocke-les dans l'ordre gauche "
    + "à droite du tableau, colonne 0 = la maille la plus à gauche du diagramme). Pour chaque rang qui contient au moins une case \"x\", ajoute une "
    + "entrée dans \"notes\" (clé = numéro du rang en texte). " + CHART_NOTE_RULE + "\n\n"
    + "Réponds uniquement avec un JSON de cette forme exacte, sans texte autour :\n"
    + sizeRule + "\n\n" + "{\"rows\": number, \"repeatRows\": number, \"cols\": number, \"legend\": [{\"symbol\": \"k\"|\"p\"|\"x\", \"meaning\": string}], "
    + "\"cells\": [[\"k\"|\"p\"|\"x\", ...], ...], \"notes\": {\"numéro de rang\": \"description\"}}"
    + patternTextForCharts(hints && hints.patternText);
}

function parseChartGrid(data, fallbackRows, fallbackCols){
  var rows = parseInt(data && data.rows, 10) || fallbackRows || 1;
  var cols = parseInt(data && data.cols, 10) || fallbackCols || 1;
  rows = Math.max(1, Math.min(rows, 300)); cols = Math.max(1, Math.min(cols, 200));
  var rawCells = (data && Array.isArray(data.cells)) ? data.cells : [];
  var cells = [];
  for (var ri = 0; ri < rows; ri++){
    var src = Array.isArray(rawCells[ri]) ? rawCells[ri] : [];
    var line = [];
    for (var ci = 0; ci < cols; ci++){
      var v = src[ci];
      line.push((v === "p" || v === "x") ? v : "k");
    }
    cells.push(line);
  }
  var notes = {};
  if (data && data.notes && typeof data.notes === "object"){
    Object.keys(data.notes).forEach(function(k){ notes[String(k)] = String(data.notes[k]); });
  }
  var repeatRows = parseInt(data && data.repeatRows, 10);
  repeatRows = (repeatRows > 0 && repeatRows <= 1000) ? repeatRows : null;
  return { rows: rows, cols: cols, cells: cells, notes: notes, repeatRows: repeatRows };
}

function readChartGrid(blob, hints){
  return sample.json(chartGridPrompt(hints), { images: blob, modelTier: "complex", cache: false }).then(function(data){
    return parseChartGrid(data, hints && hints.rows, hints && hints.cols);
  });
}

function generateChartGrid(p, c){
  if (!sample || !c.imageId) return;
  var res = cloneChartsWithTarget(p, c.id);
  if (!res.target) return;
  var target = res.target;
  p.charts = res.charts;
  target._busy = true; target._error = null; render();
  assetIdToBlob(c.imageId).then(function(blob){
    return readChartGrid(blob, { rows: c.totalRows, cols: c.cols, name: c.name, patternText: p.rawText, size: sizeHints(p.sizes, p.sizeIndex) });
  }).then(function(grid){
    target._busy = false;
    if (grid.repeatRows) target.repeatRows = grid.repeatRows;
    delete grid.repeatRows;
    target.grid = grid;
    target.totalRows = grid.rows;
    target.cols = grid.cols;
    if (!target.currentRow) target.currentRow = 1;
    persistCharts(p);
    render();
  }).catch(function(err){
    console.error(err);
    target._busy = false;
    var raw = (err && err.code) ? (err.code + (err.message ? " — " + err.message : "")) : (err && err.message ? err.message : String(err));
    target._error = sampleErrorMessage(err) + " (" + raw + ") Réessaie, ou continue avec le compteur simple.";
    render();
  });
}

// Rewrite only the per-row notes, quoting the pattern's own instructions.
// Cells (and any manual corrections) are left untouched.
function regenerateChartNotes(p, c){
  if (!sample || !c.imageId || !c.grid) return;
  var res = cloneChartsWithTarget(p, c.id);
  if (!res.target) return;
  var target = res.target;
  p.charts = res.charts;
  target._notesBusy = true; target._error = null; render();
  var g = c.grid, lines = [];
  for (var r = 1; r <= g.rows; r++){
    var cols = [];
    (g.cells[r - 1] || []).forEach(function(v, ci){ if (v === "x") cols.push(g.cols - ci); });
    if (cols.length) lines.push("Rang " + r + " : colonnes " + cols.sort(function(a, b){ return a - b; }).join(", "));
  }
  if (!lines.length){ target._notesBusy = false; render(); return; }
  assetIdToBlob(c.imageId).then(function(blob){
    var prompt = "Voici l'image d'une grille de tricot" + (c.name ? " (« " + c.name + " »)" : "") + ". Les cases de manœuvre spéciale (torsades, augmentations, diminutions...) "
      + "se trouvent aux positions suivantes (colonnes numérotées comme sous la grille, la colonne 1 étant tout à droite) :\n" + lines.join("\n") + "\n\n"
      + "Pour chacun de ces rangs, écris une note. " + CHART_NOTE_RULE + "\n\n"
      + "Réponds uniquement avec un JSON de cette forme exacte : {\"notes\": {\"numéro de rang\": \"note\"}}" + patternTextForCharts(p.rawText);
    return sample.json(prompt, { images: blob, modelTier: "default", cache: false });
  }).then(function(data){
    target._notesBusy = false;
    var notes = {};
    if (data && data.notes && typeof data.notes === "object"){
      Object.keys(data.notes).forEach(function(k){ notes[String(k)] = String(data.notes[k]); });
    }
    if (Object.keys(notes).length){
      target.grid = Object.assign({}, target.grid, { notes: notes });
      persistCharts(p);
    }
    render();
  }).catch(function(err){
    console.error(err);
    target._notesBusy = false;
    target._error = sampleErrorMessage(err) + " Les explications n'ont pas pu être refaites.";
    render();
  });
}

// ---------- CHARTS FOUND INSIDE AN IMPORTED PDF ----------
// 1) render every page small and ask Claude which ones hold a knitting chart
//    (and roughly where on the page), 2) re-render those pages large, crop to
//    the chart, store the picture and read it cell by cell.
function renderPageCanvas(pdf, pageNum, targetWidth){
  return pdf.getPage(pageNum).then(function(page){
    var base = page.getViewport({ scale: 1 });
    var vp = page.getViewport({ scale: targetWidth / base.width });
    var canvas = document.createElement("canvas");
    canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    return page.render({ canvasContext: ctx, viewport: vp }).promise.then(function(){ return canvas; });
  });
}

function canvasToBlob(canvas, quality){
  return new Promise(function(resolve, reject){
    canvas.toBlob(function(b){ if (b) resolve(b); else reject(new Error("toBlob a échoué")); }, "image/jpeg", quality || 0.85);
  });
}

function normBox(box){
  if (!Array.isArray(box) || box.length !== 4) return null;
  var b = box.map(Number);
  if (!b.every(isFinite)) return null;
  if (b.some(function(v){ return v > 1.5; })) b = b.map(function(v){ return v / 100; });
  var x0 = Math.min(b[0], b[2]), x1 = Math.max(b[0], b[2]), y0 = Math.min(b[1], b[3]), y1 = Math.max(b[1], b[3]);
  if (x1 - x0 < 0.08 || y1 - y0 < 0.05) return null;
  return [x0, y0, x1, y1];
}

function cropCanvas(src, box){
  if (!box) return src;
  var m = 0.03;
  var x0 = Math.max(0, box[0] - m), y0 = Math.max(0, box[1] - m), x1 = Math.min(1, box[2] + m), y1 = Math.min(1, box[3] + m);
  var w = Math.round((x1 - x0) * src.width), h = Math.round((y1 - y0) * src.height);
  var c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(src, Math.round(x0 * src.width), Math.round(y0 * src.height), w, h, 0, 0, w, h);
  return c;
}

function detectAndReadCharts(w, onProgress){
  var pdf = w.pdfDoc;
  onProgress = onProgress || function(){};
  w.scan = { errors: [], detected: 0, unreadable: 0, imagesUnavailable: false };
  if (!sample || !pdf || typeof sample.limits !== "function"){ w.scan.imagesUnavailable = true; return Promise.resolve([]); }
  return sample.limits().catch(function(){ return null; }).then(function(lim){
    if (!lim || !lim.images){ w.scan.imagesUnavailable = true; return []; }
    var per = Math.max(1, Math.min(lim.images.maxCount || 1, 8));
    var total = Math.min(pdf.numPages, 24);
    var batches = [];
    for (var start = 1; start <= total; start += per){
      var b = [];
      for (var n = start; n < start + per && n <= total; n++) b.push(n);
      batches.push(b);
    }
    var found = [];
    onProgress("Recherche de grilles dans le PDF...");
    return batches.reduce(function(chain, batch){
      return chain.then(function(){
        return Promise.all(batch.map(function(n){
          return renderPageCanvas(pdf, n, 900).then(function(cv){ return canvasToBlob(cv, 0.75); });
        })).then(function(blobs){
          var prompt = "Voici " + batch.length + " page(s) d'un patron de tricot (image 1 = page " + batch[0] + " du PDF, image 2 = page suivante, etc.). "
            + "Repère chaque GRILLE de tricot : un diagramme quadrillé où chaque case représente une maille, avec des symboles et des numéros de rangs "
            + "(grille de torsade, de jacquard, de dentelle, de point fantaisie...). Ignore les schémas de mesures, les silhouettes, les photos et les tableaux de tailles. "
            + "Pour chaque grille trouvée, donne : image (numéro de l'image, 1 = la première envoyée), name (le nom ou titre indiqué près de la grille, sinon un nom court descriptif), "
            + "rows (nombre de rangs de la grille si lisible, sinon null), cols (nombre de mailles de large si lisible, sinon null), "
            + "box ([gauche, haut, droite, bas] : position de la grille dans la page en fractions de 0 à 1, numéros de rangs et de colonnes inclus, sans la légende).\n\n"
            + "Réponds uniquement avec un JSON de cette forme exacte : {\"charts\": [{\"image\": number, \"name\": string, \"rows\": number|null, \"cols\": number|null, \"box\": [number, number, number, number]}]}. "
            + "S'il n'y a aucune grille, réponds {\"charts\": []}." + chartTextHint(w.rawText);
          return sample.json(prompt, { images: blobs, modelTier: "default" });
        }).then(function(res){
          var list = (res && Array.isArray(res.charts)) ? res.charts : [];
          list.forEach(function(ch){
            var k = parseInt(ch && ch.image, 10);
            if (!k || k < 1 || k > batch.length) return;
            found.push({ page: batch[k - 1], name: String((ch && ch.name) || "").slice(0, 80), rows: parseInt(ch.rows, 10) || null, cols: parseInt(ch.cols, 10) || null, box: normBox(ch.box) });
          });
        }).catch(function(err){ console.error("chart detection failed", err); w.scan.errors.push((err && err.code) || "erreur"); });
      });
    }, Promise.resolve()).then(function(){
      found = found.slice(0, 6);
      w.scan.detected = found.length;
      var out = [];
      return found.reduce(function(chain, f, idx){
        return chain.then(function(){
          onProgress("Lecture de la grille " + (idx + 1) + " / " + found.length + (f.name ? " : " + f.name : "") + "... (peut prendre 1 à 2 min)");
          return renderPageCanvas(pdf, f.page, 2000).then(function(cv){
            return canvasToBlob(cropCanvas(cv, f.box), 0.9);
          }).then(function(blob){
            var upload = assets
              ? assets.upload(blob).then(function(r){ return r.id; }).catch(function(e){ console.error("chart upload failed", e); return null; })
              : Promise.resolve(null);
            var read = readChartGrid(blob, { rows: f.rows, cols: f.cols, name: f.name, patternText: w.rawText, size: sizeHints(w.sizes, w.sizeIndex) }).catch(function(e){ console.error("chart read failed", e); w.scan.unreadable++; w.scan.errors.push((e && e.code) || "erreur"); return null; });
            return Promise.all([upload, read]);
          }).then(function(r){
            var imageId = r[0], grid = r[1];
            if (!imageId && !grid) return;
            out.push({ id: newChartId(), name: f.name || ("Grille " + (idx + 1)), imageId: imageId || null,
              totalRows: grid ? grid.rows : (f.rows || 1), cols: grid ? grid.cols : (f.cols || 18),
              repeatRows: (grid && grid.repeatRows) || null,
              currentRow: 1, grid: grid, pdfPage: f.page });
          }).catch(function(e){ console.error("chart extraction failed", e); });
        });
      }, Promise.resolve()).then(function(){ return out; });
    });
  }).catch(function(err){ console.error("charts", err); return []; });
}

function chartTextHint(raw){
  raw = String(raw || "");
  var re = /(chart|grille|diagram|diagramme|schéma de point)/ig, m, bits = [], last = -1000;
  while ((m = re.exec(raw)) && bits.length < 4){
    if (m.index - last < 200) continue;
    last = m.index;
    bits.push(raw.slice(Math.max(0, m.index - 60), m.index + 160).replace(/\s+/g, " ").trim());
  }
  if (!bits.length) return "";
  return "\n\nPour info, le texte du patron mentionne ceci au sujet de ses grilles (elles peuvent être en fin de patron) :\n- " + bits.join("\n- ");
}

function chartScanNote(scan, foundCount){
  if (!scan) return "";
  if (foundCount) return foundCount + (foundCount > 1 ? " grilles trouvées" : " grille trouvée") + " dans le PDF"
    + (scan.unreadable ? " (" + scan.unreadable + " repérée(s) mais pas lue(s) : utilise « Essayer de la générer avec l'IA » ou remplis-la à la main)." : ".");
  if (scan.imagesUnavailable) return "La recherche de grilles a besoin de la lecture d'images, qui n'est pas disponible dans cette vue de Claude. Essaie depuis un navigateur sur ordinateur.";
  if (scan.errors.length) return "La recherche de grilles a échoué (" + scan.errors.slice(0, 3).join(", ") + "). Tu peux la relancer.";
  return "Aucune grille repérée dans le PDF. Tu peux relancer la recherche, ou ajouter la grille à partir d'une photo.";
}

// Re-run the chart search on an existing project: the PDF isn't stored, so
// the knitter picks the file again.
function rescanChartsFromPdf(p){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/pdf,.pdf"; inp.style.display = "none";
  inp.onchange = function(){
    var f = inp.files && inp.files[0]; inp.remove();
    if (!f) return;
    state.chartsPending = state.chartsPending || {};
    state.chartsPending[p.id] = "Lecture du PDF...";
    render();
    f.arrayBuffer().then(function(buf){
      return loadPdfJs().then(function(){
        try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_SRC; } catch(e){}
        return window.pdfjsLib.getDocument({ data: buf }).promise;
      });
    }).then(function(pdf){
      var w = { pdfDoc: pdf, rawText: p.rawText || "", projectId: p.id, sizes: p.sizes || [], sizeIndex: p.sizeIndex || 0 };
      w.chartsPromise = detectAndReadCharts(w, function(msg){
        w.chartNote = msg;
        if (state.chartsPending && state.chartsPending[p.id]){
          state.chartsPending[p.id] = msg;
          if (state.view === "project" && state.currentId === p.id && state.activePanel !== "edit") render();
        }
      });
      attachPdfCharts(w, p.id);
    }).catch(function(err){
      console.error(err);
      delete state.chartsPending[p.id];
      state.error = "Impossible de lire ce PDF.";
      render();
    });
  };
  document.body.appendChild(inp);
  inp.click();
}

function attachPdfCharts(w, projectId){
  w.projectId = projectId;
  state.chartsPending = state.chartsPending || {};
  state.chartsPending[projectId] = w.chartNote || "Recherche de grilles dans le PDF...";
  render();
  w.chartsPromise.then(function(found){
    found = found || [];
    delete state.chartsPending[projectId];
    var scan = { at: new Date().toISOString(), found: found.length, note: chartScanNote(w.scan, found.length) };
    var ref = db.collection("projects").doc(projectId);
    var live = (state.currentDoc && state.currentDoc.id === projectId) ? state.currentDoc : null;
    var existingP = live ? Promise.resolve(live.charts || []) : ref.get().then(function(snap){ return (snap.exists && snap.data().charts) || []; });
    existingP.then(function(existing){
      var charts = existing.concat(found);
      if (state.currentDoc && state.currentDoc.id === projectId){
        state.currentDoc.charts = charts;
        state.currentDoc.chartScan = scan;
      }
      state.chartsFound = state.chartsFound || {};
      state.chartsFound[projectId] = { n: found.length, note: scan.note };
      if (state.activePanel !== "edit") render();
      var patch = { chartScan: scan };
      if (found.length){ patch.charts = charts; patch.updatedAt = new Date().toISOString(); }
      queueWrite(function(){ return ref.update(patch); }).catch(function(e){ console.error(e); });
    });
  });
}

function saveChartDraft(){
  var d = state.chartDraft;
  var p = state.currentDoc;
  if (!d.name.trim()){ d.error = "Donne un nom à la grille."; render(); return; }
  var totalRows = parseInt(d.totalRows, 10);
  if (!totalRows || totalRows < 1){ d.error = "Indique un nombre de rangs valide."; render(); return; }
  var cols = parseInt(d.cols, 10);
  if (!cols || cols < 1){ d.error = "Indique le nombre de mailles de large de la grille."; render(); return; }
  d.busy = true; d.error = null; render();
  function finalize(imageId, imageData){
    var chart = { id: newChartId(), name: d.name.trim(), imageId: imageId || null, totalRows: totalRows, cols: cols, currentRow: 1, grid: null };
    if (imageData) chart.imageData = imageData;
    var charts = (p.charts || []).concat([chart]);
    p.charts = charts;
    var ref = currentRef();
    if (ref) queueWrite(function(){ return ref.update({ charts: charts, updatedAt: new Date().toISOString() }); }).catch(function(e){ console.error(e); });
    d.busy = false;
    state.chartDraft = null;
    render();
  }
  if (d.file && assets){
    assets.upload(d.file).then(function(res){ finalize(res.id); }).catch(function(err){
      console.error(err);
      d.busy = false;
      d.error = "Impossible d'importer l'image, réessaie.";
      render();
    });
  } else if (d.file && LOCAL_MODE){
    fileToDataUrl(d.file, 1800).then(function(du){ finalize(null, du); }).catch(function(err){
      console.error(err);
      d.busy = false;
      d.error = "Impossible de lire l'image, réessaie.";
      render();
    });
  } else {
    finalize(null);
  }
}

function createBlankGrid(p, c){

}

// ---------- PATTERN PDF (stored as-is, viewable in the app) ----------
function canStorePdf(){ return !!(assets || localFiles); }

function storePdfBlob(blob, name){
  var pdf = (blob.type === "application/pdf") ? blob : new Blob([blob], { type: "application/pdf" });
  if (assets) return assets.upload(pdf).then(function(r){ return { pdfId: r.id, pdfName: name || "patron.pdf" }; });
  if (localFiles) return localFiles.put(pdf).then(function(id){ return { pdfFileId: id, pdfName: name || "patron.pdf" }; });
  return Promise.reject({ code: "unavailable", message: "stockage indisponible" });
}

function getProjectPdfBlob(p){
  if (p.pdfFileId && localFiles) return localFiles.get(p.pdfFileId);
  if (p.pdfId) return fetch("/_blob/" + p.pdfId).then(function(r){ return r.ok ? r.blob() : null; });
  return Promise.resolve(null);
}

function blobToDataUrl(blob){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onload = function(){ resolve(fr.result); };
    fr.onerror = function(){ reject(fr.error); };
    fr.readAsDataURL(blob);
  });
}

function attachPdfToProject(projectId, file){
  if (!canStorePdf() || !db) return;
  state.pdfBusy = projectId; if (state.activePanel === "pdf") render();
  storePdfBlob(file, file.name).then(function(info){
    return db.collection("projects").doc(projectId).update(Object.assign({}, info, { updatedAt: new Date().toISOString() })).then(function(){ return info; });
  }).then(function(info){
    state.pdfBusy = null;
    if (state.currentDoc && state.currentDoc.id === projectId) Object.assign(state.currentDoc, info);
    state.projects = state.projects.map(function(x){ return x.id === projectId ? Object.assign({}, x, info) : x; });
    if (state.activePanel === "pdf") render();
  }).catch(function(err){
    console.error("pdf store failed", err);
    state.pdfBusy = null;
    state.error = "Impossible d'enregistrer le PDF" + ((err && err.code) ? " (" + err.code + ")" : "") + ". S'il est très lourd (plus de 20 Mo), il ne peut pas être gardé.";
    render();
  });
}

function pickPdfFile(onFile){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/pdf,.pdf"; inp.style.display = "none";
  inp.onchange = function(){ var f = inp.files && inp.files[0]; inp.remove(); if (f) onFile(f); };
  document.body.appendChild(inp);
  inp.click();

// Pages are rendered once per PDF to JPEG images (light on memory, pinch-zoomable)
// and the <img> nodes are kept so re-renders of the page don't redo the work.
function loadPdfPages(p, key){
  if (state.pdfCache){
    (state.pdfCache.imgs || []).forEach(function(img){ try { URL.revokeObjectURL(img.src); } catch(e){} });
    if (state.pdfCache.url) try { URL.revokeObjectURL(state.pdfCache.url); } catch(e){}
  }
  var cache = state.pdfCache = { key: key, imgs: [], loading: true, done: 0, total: 0, url: null, error: null };
  function status(){
    var st = document.getElementById("pdf-status");
    if (st) st.textContent = cache.error ? cache.error : (cache.loading ? "Chargement des pages... " + cache.done + (cache.total ? " / " + cache.total : "") : "");
  }
  getProjectPdfBlob(p).then(function(blob){
    if (!blob) throw new Error("PDF introuvable");
    cache.url = URL.createObjectURL(blob);
    var full = document.getElementById("pdf-open");
    if (full){ full.href = cache.url; full.style.display = ""; }
    return blob.arrayBuffer();
  }).then(function(buf){
    return loadPdfJs().then(function(){
      try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_SRC; } catch(e){}
      return window.pdfjsLib.getDocument({ data: buf }).promise;
    });
  }).then(function(pdf){
    cache.total = pdf.numPages; status();
    var width = Math.min(1600, Math.max(900, Math.round((window.innerWidth || 400) * (window.devicePixelRatio || 2))));
    var nums = []; for (var n = 1; n <= pdf.numPages; n++) nums.push(n);
    return nums.reduce(function(chain, n){
      return chain.then(function(){
        if (state.pdfCache !== cache) return;
        return renderPageCanvas(pdf, n, width).then(function(cv){ return canvasToBlob(cv, 0.85); }).then(function(b){
          if (state.pdfCache !== cache) return;
          var img = el("img", { src: URL.createObjectURL(b), alt: "Page " + n, style: "width:100%;border-radius:6px;border:1px solid var(--line);background:#fff;" });
          cache.imgs.push(img);
          cache.done = n;
          var holder = document.getElementById("pdf-pages");
          if (holder) holder.appendChild(img);
          status();
        });
      });
    }, Promise.resolve());
  }).then(function(){
    cache.loading = false; status();
  }).catch(function(err){
    console.error("pdf view failed", err);
    cache.loading = false;
    cache.error = "Impossible d'afficher le PDF (" + ((err && (err.code || err.message)) || "erreur") + ").";
    status();
  });
}

// ---------- EXPORT / IMPORT ----------
// A project travels as one JSON file. Pictures (cover, chart photos) ride
// inside it as JPEG data URLs so the standalone app gets them too.
function slugify(t){
  return String(t || "patron").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "patron";
}

function imageToDataUrl(src, maxW){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){
      try{
        var nw = img.naturalWidth || maxW, nh = img.naturalHeight || maxW;
        var scale = Math.min(1, maxW / nw);
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(nw * scale)); c.height = Math.max(1, Math.round(nh * scale));
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.85));
      } catch(e){ reject(e); }
    };
    img.onerror = function(){ reject(new Error("image illisible")); };
    img.src = src;
  });
}

function fileToDataUrl(file, maxW){
  var url = URL.createObjectURL(file);
  return imageToDataUrl(url, maxW).then(function(du){ URL.revokeObjectURL(url); return du; },
    function(e){ URL.revokeObjectURL(url); throw e; });
}

function assetToDataUrl(imageId, maxW){
  return imageToDataUrl("/_blob/" + imageId, maxW).catch(function(e){ console.error("asset read failed", e); return null; });
}

function dataUrlToBlob(du){
  var comma = du.indexOf(",");
  var mime = (du.slice(0, comma).match(/data:([^;,]+)/) || [])[1] || "image/jpeg";
  var bin = atob(du.slice(comma + 1));
  var arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function isImageDataUrl(v){ return typeof v === "string" && /^data:image\/(jpeg|png|webp|gif);base64,/.test(v); }

// Put an imported picture where this version keeps pictures: the asset store
// on claude.ai, inline in the project on the standalone app.
function storeImportedImage(du){
  if (!isImageDataUrl(du)) return Promise.resolve({});
  if (assets){
    return assets.upload(dataUrlToBlob(du)).then(function(r){ return { imageId: r.id }; })
      .catch(function(e){ console.error("image upload failed", e); return {}; });
  }
  if (LOCAL_MODE) return Promise.resolve({ imageData: du });
  return Promise.resolve({});
}

function exportProject(p){
  if (!downloads || state.exportBusy) return;
  state.exportBusy = true; render();
  var charts = JSON.parse(JSON.stringify(p.charts || []));
  var imgJobs = charts.map(function(c){
    if (isImageDataUrl(c.imageData)) return Promise.resolve(c.imageData);
    return c.imageId ? assetToDataUrl(c.imageId, 1800) : Promise.resolve(null);
  });
  var coverJob = isImageDataUrl(p.coverData) ? Promise.resolve(p.coverData)
    : (p.coverImageId ? assetToDataUrl(p.coverImageId, 600) : Promise.resolve(null));
  var pdfJob = getProjectPdfBlob(p).then(function(b){ return b ? blobToDataUrl(b) : null; }).catch(function(e){ console.error("pdf export failed", e); return null; });
  Promise.all([Promise.all(imgJobs), coverJob, pdfJob]).then(function(r){
    var chartImgs = r[0], cover = r[1], pdfData = r[2];
    charts.forEach(function(c, k){
      delete c.imageId; delete c._busy; delete c._error; delete c._notesBusy; delete c.imageData;
      if (chartImgs[k]) c.imageData = chartImgs[k];
    });
    var project = {
      title: p.title || "Mon patron",
      sizes: p.sizes || [],
      sizeIndex: p.sizeIndex || 0,
      rawText: p.rawText || "",
      sections: JSON.parse(JSON.stringify(p.sections || [])),
      progress: p.progress || { flatIndex: 0, tally: 0, row: 1 },
      reference: p.reference || null,
      charts: charts
    };
    if (cover) project.coverData = cover;
    if (pdfData){ project.pdfData = pdfData; project.pdfName = p.pdfName || (slugify(p.title) + ".pdf"); }
    var payload = { format: "patron-tricot", version: 2, exportedAt: new Date().toISOString(), project: project };
    state.exportBusy = false; render();
    return downloads.save({ filename: slugify(p.title) + ".json", data: JSON.stringify(payload) });
  }).catch(function(err){
    state.exportBusy = false;
    if (err && err.code === "declined") { render(); return; }
    console.error(err);
    state.error = "Impossible d'exporter le projet (" + ((err && err.code) || "erreur") + ").";
    render();
  });
}

function pickJsonFile(onFile){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json"; inp.style.display = "none";
  inp.onchange = function(){ var f = inp.files && inp.files[0]; inp.remove(); if (f) onFile(f); };
  document.body.appendChild(inp);
  inp.click();
}

function importProjectFromFile(file){
  if (!db) return;
  state.importMsg = null;
  var reader = new FileReader();
  reader.onerror = function(){ state.importMsg = { ok:false, text:"Impossible de lire ce fichier." }; render(); };
  reader.onload = function(){
    var data;
    try { data = JSON.parse(reader.result); } catch(e){ data = null; }
    var pr = data && data.format === "patron-tricot" && data.project;
    if (!pr || !Array.isArray(pr.sections)){
      state.importMsg = { ok:false, text:"Ce fichier n'est pas un projet exporté depuis Patron Tricot." };
      render();
      return;
    }
    var sections = pr.sections.map(function(sec){
      return {
        name: String((sec && sec.name) || "Section"),
        steps: ((sec && sec.steps) || []).map(function(st){
          return {
            text: String((st && st.text) || ""),
            repeatCount: (st && typeof st.repeatCount === "number") ? st.repeatCount : null,
            rowsPerRepeat: (st && typeof st.rowsPerRepeat === "number") ? st.rowsPerRepeat : null,
            translation: (st && typeof st.translation === "string" && st.translation.trim()) ? st.translation : null
          };
        })
      };
    });
    var rawCharts = (Array.isArray(pr.charts) ? pr.charts : []).filter(function(c){ return c && typeof c === "object"; });
    state.importMsg = { ok:true, text:"Import en cours..." };
    render();
    var chartJobs = rawCharts.map(function(c){
      var copy = JSON.parse(JSON.stringify(c));
      var du = copy.imageData;
      delete copy.imageId; delete copy.imageData; delete copy._busy; delete copy._error;
      if (!copy.id) copy.id = newChartId();
      return storeImportedImage(du).then(function(img){ return Object.assign(copy, img); });
    });
    var coverJob = storeImportedImage(pr.coverData);
    var pdfJob = (typeof pr.pdfData === "string" && pr.pdfData.indexOf("data:application/pdf;base64,") === 0)
      ? storePdfBlob(dataUrlToBlob(pr.pdfData), String(pr.pdfName || "patron.pdf")).catch(function(e){ console.error("pdf import failed", e); return {}; })
      : Promise.resolve({});
    Promise.all([Promise.all(chartJobs), coverJob, pdfJob]).then(function(r){
      var charts = r[0], cover = r[1], pdfInfo = r[2];
      var now = new Date().toISOString();
      var docData = {
        title: String(pr.title || "Patron importé"),
        sizes: Array.isArray(pr.sizes) ? pr.sizes.map(String) : [],
        sizeIndex: parseInt(pr.sizeIndex, 10) || 0,
        rawText: String(pr.rawText || ""),
        sections: sections,
        progress: pr.progress && typeof pr.progress === "object" ? pr.progress : { flatIndex: 0, tally: 0, row: 1 },
        charts: charts,
        createdAt: now,
        updatedAt: now
      };
      if (pr.reference && typeof pr.reference === "object") docData.reference = pr.reference;
      if (cover.imageId) docData.coverImageId = cover.imageId;
      if (cover.imageData) docData.coverData = cover.imageData;
      Object.assign(docData, pdfInfo);
      return withTimeout(db.collection("projects").add(docData), 20000).then(function(ref){
        state.importMsg = null;
        openProject(ref.id, Object.assign({}, docData, { id: ref.id }));
      });
    }).catch(function(err){
      console.error(err);
      state.importMsg = { ok:false, text:"Impossible d'enregistrer le projet importé." };
      render();
    });
  };
  reader.readAsText(file);
}

    var secBox = el("div", {class:"section-edit"}, []);
    secBox.appendChild(el("div", {class:"section-edit-head"}, [
      el("input", {type:"text", value: sec.name||"", oninput:function(e){ updateSectionField(si, "name", e.target.value); }}),
      el("button", {class:"icon-btn", onclick:function(){ removeSection(si); }}, ["✕"])
    ]));
    (sec.steps||[]).forEach(function(st, sti){
      secBox.appendChild(el("div", {class:"step-edit-row"}, [
        el("textarea", {rows:"2", oninput:function(e){ updateStepField(si, sti, "text", e.target.value); }}, [st.text||""]),
        el("div", {class:"row2"}, [
          el("span", {class:"small-note"}, ["Rangs par répétition :"]),
          el("input", {type:"number", min:"0", value: st.rowsPerRepeat||"", placeholder:"— (ex: 8)",
            title:"Si cette étape regroupe un bloc de plusieurs rangs numérotés qui se répète (ex: « rangs 1 à 8 »), indique combien de rangs compte le bloc — un compteur de rang dédié apparaîtra, qui fait avancer les répétitions automatiquement.",
            oninput:function(e){
              var v = e.target.value === "" ? null : parseInt(e.target.value, 10);
              updateStepField(si, sti, "rowsPerRepeat", isNaN(v) ? null : v);
            }})
        ]),
        el("div", {class:"row2"}, [
          el("span", {class:"small-note"}, ["Répétitions :"]),
          el("input", {type:"number", min:"0", value: st.repeatCount||"", placeholder:"—", oninput:function(e){
            var v = e.target.value === "" ? null : parseInt(e.target.value, 10);
            updateStepField(si, sti, "repeatCount", isNaN(v) ? null : v);
          }}),
          el("span", {style:"flex:1;"}),
          el("button", {class:"icon-btn", onclick:function(){ removeStep(si, sti); }}, ["✕"])
        ])
      ]));
    });
    secBox.appendChild(el("button", {class:"link-btn", onclick:function(){ addStep(si); }}, ["+ Ajouter une étape"]));
    box.appendChild(secBox);
  });
  box.appendChild(el("button", {class:"btn btn-ghost btn-sm", onclick: addSection}, ["+ Ajouter une section"]));
  return box;
}

function renameProject(p, title){
  title = String(title || "").trim();
  if (!title || title === p.title) return;
  p.title = title;
  state.projects = state.projects.map(function(x){ return x.id === p.id ? Object.assign({}, x, { title: title }) : x; });
  var ref = currentRef();
  if (ref) queueWrite(function(){ return ref.update({ title: title, updatedAt: new Date().toISOString() }); }).catch(function(e){ console.error(e); });
  render();
}

function cloneSections(p){
  return JSON.parse(JSON.stringify(p.sections || []));
}

function commitSections(sections){
  var ref = currentRef();
  if (!ref) return;
  queueWrite(function(){ return ref.update({ sections: sections, updatedAt: new Date().toISOString() }); });
}

function updateSectionField(si, field, val){
  var p = state.currentDoc; if (!p) return;
  var sections = cloneSections(p);
  if (!sections[si]) return;
  sections[si][field] = val;
  p.sections = sections;
  commitSections(sections);
}
function updateStepField(si, sti, field, val){
  var p = state.currentDoc; if (!p) return;
  var sections = cloneSections(p);
  if (!sections[si] || !sections[si].steps[sti]) return;
  sections[si].steps[sti][field] = val;
  if (field === "text") delete sections[si].steps[sti].translation;
  p.sections = sections;
  commitSections(sections);
}
function addStep(si){
  var p = state.currentDoc; if (!p) return;
  var sections = cloneSections(p);
  sections[si].steps.push({ text:"Nouvelle étape", repeatCount:null, rowsPerRepeat:null });
  p.sections = sections;
  commitSections(sections);
  render();
}
function removeStep(si, sti){
  var p = state.currentDoc; if (!p) return;
  var sections = cloneSections(p);
  sections[si].steps.splice(sti, 1);
  p.sections = sections;
  commitSections(sections);
  render();
}
function addSection(){
  var p = state.currentDoc; if (!p) return;
  var sections = cloneSections(p);
  sections.push({ name:"Nouvelle section", steps:[] });
  p.sections = sections;
  commitSections(sections);
  render();
}
function removeSection(si){
  var p = state.currentDoc; if (!p) return;
  var sections = cloneSections(p);
  sections.splice(si, 1);
  p.sections = sections;
  commitSections(sections);
  render();
}


// ---------- LOCAL STORAGE (replaces the claude.ai database) ----------
// Same small API surface the app already uses: collection().get/add, doc().get/update/delete.
var localIdbPromise = null;
function openLocalIdb(){
  if (localIdbPromise) return localIdbPromise;
  localIdbPromise = new Promise(function(resolve, reject){
    var req = indexedDB.open("patron-tricot", 2);
    req.onupgradeneeded = function(){
      var d = req.result;
      if (!d.objectStoreNames.contains("projects")) d.createObjectStore("projects", { keyPath: "id" });
      if (!d.objectStoreNames.contains("files")) d.createObjectStore("files");
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error("IndexedDB indisponible")); };
  });
  return localIdbPromise;
}

// Big files (the pattern PDF) live in their own store so that every counter
// tap doesn't rewrite megabytes along with the project.
function makeLocalFiles(){
  function run(mode, fn){
    return openLocalIdb().then(function(d){
      return new Promise(function(resolve, reject){
        var t = d.transaction("files", mode);
        var req = fn(t.objectStore("files"));
        t.oncomplete = function(){ resolve(req && req.result); };
        t.onerror = function(){ reject(t.error); };
        t.onabort = function(){ reject(t.error); };
      });
    });
  }
  return {
    put: function(blob){
      var id = "f_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      return run("readwrite", function(s){ return s.put(blob, id); }).then(function(){ return id; });
    },
    get: function(id){ return run("readonly", function(s){ return s.get(id); }).then(function(b){ return b || null; }); },
    delete: function(id){ return run("readwrite", function(s){ return s.delete(id); }).then(function(){}); }
  };
}

function makeLocalDb(){
  function open(){ return openLocalIdb(); }
  function tx(mode, fn){
    return open().then(function(d){
      return new Promise(function(resolve, reject){
        var t = d.transaction("projects", mode);
        var store = t.objectStore("projects");
        var out = fn(store);
        t.oncomplete = function(){ resolve(out && out.result !== undefined ? out.result : out); };
        t.onerror = function(){ reject(t.error); };
        t.onabort = function(){ reject(t.error); };
      });
    });
  }
  function snap(id, data){
    return { id: id, exists: !!data, data: function(){ if (!data) return undefined; var c = Object.assign({}, data); delete c.id; return c; } };
  }
  function docRef(id){
    return {
      id: id,
      get: function(){ return tx("readonly", function(s){ return s.get(id); }).then(function(r){ return snap(id, r); }); },
      update: function(patch){
        return tx("readwrite", function(s){
          var g = s.get(id);
          g.onsuccess = function(){
            if (!g.result) return;
            s.put(Object.assign({}, g.result, patch, { id: id }));
          };
          return g;
        }).then(function(){});
      },
      delete: function(){ return tx("readwrite", function(s){ return s.delete(id); }).then(function(){}); }
    };
  }
  return {
    collection: function(){
      return {
        get: function(){
          return tx("readonly", function(s){ return s.getAll(); }).then(function(rows){
            return { docs: (rows || []).map(function(r){ return snap(r.id, r); }) };
          });
        },
        add: function(data){
          var id = "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
          return tx("readwrite", function(s){ return s.put(Object.assign({}, data, { id: id })); }).then(function(){ return docRef(id); });
        },
        doc: docRef
      };
    }
  };
}

// ---------- EXPORT FILE (replaces the claude.ai download prompt) ----------
function makeDownloads(){
  return {
    save: function(req){
      return new Promise(function(resolve, reject){
        try {
          var blob = new Blob([req.data], { type: "application/json" });
          var file = new File([blob], req.filename, { type: "application/json" });
          if (navigator.canShare && navigator.canShare({ files: [file] })){
            navigator.share({ files: [file], title: req.filename }).then(function(){ resolve({ status: "saved" }); },
              function(e){ if (e && e.name === "AbortError") reject({ code: "declined" }); else reject({ code: "unavailable" }); });
            return;
          }
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = req.filename;
          document.body.appendChild(a);
          a.click();
          setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
          resolve({ status: "saved" });
        } catch(e){ reject({ code: "unavailable", message: String(e) }); }
      });
    }
  };
}

// ---------- INIT ----------
function withDeadline(promise, ms){
  return new Promise(function(resolve){
    var done = false;
    var t = setTimeout(function(){ if (!done){ done = true; resolve(null); } }, ms);
    promise.then(function(v){ if (!done){ done = true; clearTimeout(t); resolve(v); } },
                 function(){ if (!done){ done = true; clearTimeout(t); resolve(null); } });
  });
}

window.addEventListener("error", function(e){
  state.error = "Erreur JS : " + (e && e.message ? e.message : "inconnue");
  try { render(); } catch(e2){}
});
window.addEventListener("unhandledrejection", function(e){
  var r = e && e.reason;
  var msg = r && (r.message || r.code) ? (r.code ? r.code + " — " : "") + (r.message || "") : String(r);
  state.error = "Erreur (promesse) : " + msg;
  try { render(); } catch(e2){}
});

function init(){
  db = makeLocalDb();
  LOCAL_MODE = true;
  localFiles = makeLocalFiles();
  sample = null;   // no AI import outside claude.ai
  assets = null;   // pictures are kept inside each project instead
  downloads = makeDownloads();
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
  subscribeProjects();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(e){ console.error("sw", e); });
}

init();
})();
