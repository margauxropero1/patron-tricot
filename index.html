}

// ---------- EXPORT / IMPORT ----------
// A project travels as one JSON file. Pictures (cover, chart photos) ride
// inside it as JPEG data URLs so the standalone app gets them too.
function slugify(t){
  return String(t || "patron").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "patron";
}

function imageToDataUrl(src, maxW){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){
      try{
        var nw = img.naturalWidth || maxW, nh = img.naturalHeight || maxW;
        var scale = Math.min(1, maxW / nw);
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(nw * scale)); c.height = Math.max(1, Math.round(nh * scale));
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.85));
      } catch(e){ reject(e); }
    };
    img.onerror = function(){ reject(new Error("image illisible")); };
    img.src = src;
  });
}

function fileToDataUrl(file, maxW){
  var url = URL.createObjectURL(file);
  return imageToDataUrl(url, maxW).then(function(du){ URL.revokeObjectURL(url); return du; },
    function(e){ URL.revokeObjectURL(url); throw e; });
}

function assetToDataUrl(imageId, maxW){
  return imageToDataUrl("/_blob/" + imageId, maxW).catch(function(e){ console.error("asset read failed", e); return null; });
}

function dataUrlToBlob(du){
  var comma = du.indexOf(",");
  var mime = (du.slice(0, comma).match(/data:([^;,]+)/) || [])[1] || "image/jpeg";
  var bin = atob(du.slice(comma + 1));
  var arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function isImageDataUrl(v){ return typeof v === "string" && /^data:image\/(jpeg|png|webp|gif);base64,/.test(v); }

// Put an imported picture where this version keeps pictures: the asset store
// on claude.ai, inline in the project on the standalone app.
function storeImportedImage(du){
  if (!isImageDataUrl(du)) return Promise.resolve({});
  if (assets){
    return assets.upload(dataUrlToBlob(du)).then(function(r){ return { imageId: r.id }; })
      .catch(function(e){ console.error("image upload failed", e); return {}; });
  }
  if (LOCAL_MODE) return Promise.resolve({ imageData: du });
  return Promise.resolve({});
}

function exportProject(p){
  if (!downloads || state.exportBusy) return;
  state.exportBusy = true; render();
  var charts = JSON.parse(JSON.stringify(p.charts || []));
  var imgJobs = charts.map(function(c){
    if (isImageDataUrl(c.imageData)) return Promise.resolve(c.imageData);
    return c.imageId ? assetToDataUrl(c.imageId, 1800) : Promise.resolve(null);
  });
  var coverJob = isImageDataUrl(p.coverData) ? Promise.resolve(p.coverData)
    : (p.coverImageId ? assetToDataUrl(p.coverImageId, 600) : Promise.resolve(null));
  Promise.all([Promise.all(imgJobs), coverJob]).then(function(r){
    var chartImgs = r[0], cover = r[1];
    charts.forEach(function(c, k){
      delete c.imageId; delete c._busy; delete c._error; delete c.imageData;
      if (chartImgs[k]) c.imageData = chartImgs[k];
    });
    var project = {
      title: p.title || "Mon patron",
      sizes: p.sizes || [],
      sizeIndex: p.sizeIndex || 0,
      rawText: p.rawText || "",
      sections: JSON.parse(JSON.stringify(p.sections || [])),
      progress: p.progress || { flatIndex: 0, tally: 0, row: 1 },
      reference: p.reference || null,
      charts: charts
    };
    if (cover) project.coverData = cover;
    var payload = { format: "patron-tricot", version: 2, exportedAt: new Date().toISOString(), project: project };
    state.exportBusy = false; render();
    return downloads.save({ filename: slugify(p.title) + ".json", data: JSON.stringify(payload) });
  }).catch(function(err){
    state.exportBusy = false;
    if (err && err.code === "declined") { render(); return; }
    console.error(err);
    state.error = "Impossible d'exporter le projet (" + ((err && err.code) || "erreur") + ").";
    render();
  });
}

function pickJsonFile(onFile){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json"; inp.style.display = "none";
  inp.onchange = function(){ var f = inp.files && inp.files[0]; inp.remove(); if (f) onFile(f); };
  document.body.appendChild(inp);
  inp.click();
}

function importProjectFromFile(file){
  if (!db) return;
  state.importMsg = null;
  var reader = new FileReader();
  reader.onerror = function(){ state.importMsg = { ok:false, text:"Impossible de lire ce fichier." }; render(); };
  reader.onload = function(){
    var data;
    try { data = JSON.parse(reader.result); } catch(e){ data = null; }
    var pr = data && data.format === "patron-tricot" && data.project;
    if (!pr || !Array.isArray(pr.sections)){
      state.importMsg = { ok:false, text:"Ce fichier n'est pas un projet exporté depuis Patron Tricot." };
      render();
      return;
    }
    var sections = pr.sections.map(function(sec){
      return {
        name: String((sec && sec.name) || "Section"),
        steps: ((sec && sec.steps) || []).map(function(st){
          return {
            text: String((st && st.text) || ""),
            repeatCount: (st && typeof st.repeatCount === "number") ? st.repeatCount : null,
            rowsPerRepeat: (st && typeof st.rowsPerRepeat === "number") ? st.rowsPerRepeat : null
          };
        })
      };
    });
    var rawCharts = (Array.isArray(pr.charts) ? pr.charts : []).filter(function(c){ return c && typeof c === "object"; });
    state.importMsg = { ok:true, text:"Import en cours..." };
    render();
    var chartJobs = rawCharts.map(function(c){
      var copy = JSON.parse(JSON.stringify(c));
      var du = copy.imageData;
      delete copy.imageId; delete copy.imageData; delete copy._busy; delete copy._error;
      if (!copy.id) copy.id = newChartId();
      return storeImportedImage(du).then(function(img){ return Object.assign(copy, img); });
    });
    var coverJob = storeImportedImage(pr.coverData);
    Promise.all([Promise.all(chartJobs), coverJob]).then(function(r){
      var charts = r[0], cover = r[1];
      var now = new Date().toISOString();
      var docData = {
        title: String(pr.title || "Patron importé"),
        sizes: Array.isArray(pr.sizes) ? pr.sizes.map(String) : [],
        sizeIndex: parseInt(pr.sizeIndex, 10) || 0,
        rawText: String(pr.rawText || ""),
        sections: sections,
        progress: pr.progress && typeof pr.progress === "object" ? pr.progress : { flatIndex: 0, tally: 0, row: 1 },
        charts: charts,
        createdAt: now,
        updatedAt: now
      };
      if (pr.reference && typeof pr.reference === "object") docData.reference = pr.reference;
      if (cover.imageId) docData.coverImageId = cover.imageId;
      if (cover.imageData) docData.coverData = cover.imageData;
      return withTimeout(db.collection("projects").add(docData), 20000).then(function(ref){
        state.importMsg = null;
        openProject(ref.id, Object.assign({}, docData, { id: ref.id }));
      });
    }).catch(function(err){
      console.error(err);
      state.importMsg = { ok:false, text:"Impossible d'enregistrer le projet importé." };
      render();
    });
  };
  reader.readAsText(file);
}

  var box = el("div", {style:"display:flex;flex-direction:column;gap:12px;"}, []);

    (sec.steps||[]).forEach(function(st, sti){
      secBox.appendChild(el("div", {class:"step-edit-row"}, [

        el("div", {class:"row2"}, [
          el("span", {class:"small-note"}, ["Rangs par répétition :"]),
          el("input", {type:"number", min:"0", value: st.rowsPerRepeat||"", placeholder:"— (ex: 8)",
            title:"Si cette étape regroupe un bloc de plusieurs rangs numérotés qui se répète (ex: « rangs 1 à 8 »), indique combien de rangs compte le bloc — un compteur de rang dédié apparaîtra, qui fait avancer les répétitions automatiquement.",
            oninput:function(e){
              var v = e.target.value === "" ? null : parseInt(e.target.value, 10);
              updateStepField(si, sti, "rowsPerRepeat", isNaN(v) ? null : v);
            }})
        ]),
        el("div", {class:"row2"}, [
          el("span", {class:"small-note"}, ["Répétitions :"]),
          el("input", {type:"number", min:"0", value: st.repeatCount||"", placeholder:"—", oninput:function(e){
            var v = e.target.value === "" ? null : parseInt(e.target.value, 10);
            updateStepField(si, sti, "repeatCount", isNaN(v) ? null : v);
          }}),
          el("span", {style:"flex:1;"}),
          el("button", {class:"icon-btn", onclick:function(){ removeStep(si, sti); }}, ["✕"])
        ])
      ]));
    });
    secBox.appendChild(el("button", {class:"link-btn", onclick:function(){ addStep(si); }}, ["+ Ajouter une étape"]));
    box.appendChild(secBox);
  });
  box.appendChild(el("button", {class:"btn btn-ghost btn-sm", onclick: addSection}, ["+ Ajouter une section"]));
  return box;

function cloneSections(p){
  return JSON.parse(JSON.stringify(p.sections || []));
}

function commitSections(sections){
  var ref = currentRef();
  if (!ref) return;
  queueWrite(function(){ return ref.update({ sections: sections, updatedAt: new Date().toISOString() }); });
}

function updateSectionField(si, field, val){
  var p = state.currentDoc; if (!p) return;
  var sections = cloneSections(p);
  if (!sections[si]) return;
  sections[si][field] = val;
  p.sections = sections;
  commitSections(sections);
}
function updateStepField(si, sti, field, val){
  var p = state.currentDoc; if (!p) return;
  var sections = cloneSections(p);
  if (!sections[si] || !sections[si].steps[sti]) return;
  sections[si].steps[sti][field] = val;
  p.sections = sections;
  commitSections(sections);
}
function addStep(si){
  var p = state.currentDoc; if (!p) return;
  var sections = cloneSections(p);
  sections[si].steps.push({ text:"Nouvelle étape", repeatCount:null, rowsPerRepeat:null });
  p.sections = sections;
  commitSections(sections);
  render();
}
function removeStep(si, sti){
  var p = state.currentDoc; if (!p) return;
  var sections = cloneSections(p);
  sections[si].steps.splice(sti, 1);
  p.sections = sections;
  commitSections(sections);
  render();
}
function addSection(){
  var p = state.currentDoc; if (!p) return;
  var sections = cloneSections(p);
  sections.push({ name:"Nouvelle section", steps:[] });
  p.sections = sections;
  commitSections(sections);
  render();
}
function removeSection(si){
  var p = state.currentDoc; if (!p) return;
  var sections = cloneSections(p);
  sections.splice(si, 1);
  p.sections = sections;
  commitSections(sections);
  render();
}


// ---------- LOCAL STORAGE (replaces the claude.ai database) ----------
// Same small API surface the app already uses: collection().get/add, doc().get/update/delete.
function makeLocalDb(){
  var dbPromise = null;
  function open(){
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function(resolve, reject){
      var req = indexedDB.open("patron-tricot", 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore("projects", { keyPath: "id" }); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error || new Error("IndexedDB indisponible")); };
    });
    return dbPromise;
  }
  function tx(mode, fn){
    return open().then(function(d){
      return new Promise(function(resolve, reject){
        var t = d.transaction("projects", mode);
        var store = t.objectStore("projects");
        var out = fn(store);
        t.oncomplete = function(){ resolve(out && out.result !== undefined ? out.result : out); };
        t.onerror = function(){ reject(t.error); };
        t.onabort = function(){ reject(t.error); };
      });
    });
  }
  function snap(id, data){
    return { id: id, exists: !!data, data: function(){ if (!data) return undefined; var c = Object.assign({}, data); delete c.id; return c; } };
  }
  function docRef(id){
    return {
      id: id,
      get: function(){ return tx("readonly", function(s){ return s.get(id); }).then(function(r){ return snap(id, r); }); },
      update: function(patch){
        return tx("readwrite", function(s){
          var g = s.get(id);
          g.onsuccess = function(){
            if (!g.result) return;
            s.put(Object.assign({}, g.result, patch, { id: id }));
          };
          return g;
        }).then(function(){});
      },
      delete: function(){ return tx("readwrite", function(s){ return s.delete(id); }).then(function(){}); }
    };
  }
  return {
    collection: function(){
      return {
        get: function(){
          return tx("readonly", function(s){ return s.getAll(); }).then(function(rows){
            return { docs: (rows || []).map(function(r){ return snap(r.id, r); }) };
          });
        },
        add: function(data){
          var id = "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
          return tx("readwrite", function(s){ return s.put(Object.assign({}, data, { id: id })); }).then(function(){ return docRef(id); });
        },
        doc: docRef
      };
    }
  };
}

// ---------- EXPORT FILE (replaces the claude.ai download prompt) ----------
function makeDownloads(){
  return {
    save: function(req){
      return new Promise(function(resolve, reject){
        try {
          var blob = new Blob([req.data], { type: "application/json" });
          var file = new File([blob], req.filename, { type: "application/json" });
          if (navigator.canShare && navigator.canShare({ files: [file] })){
            navigator.share({ files: [file], title: req.filename }).then(function(){ resolve({ status: "saved" }); },
              function(e){ if (e && e.name === "AbortError") reject({ code: "declined" }); else reject({ code: "unavailable" }); });
            return;
          }
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = req.filename;
          document.body.appendChild(a);
          a.click();
          setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
          resolve({ status: "saved" });
        } catch(e){ reject({ code: "unavailable", message: String(e) }); }
      });
    }
  };
}

// ---------- INIT ----------
function withDeadline(promise, ms){
  return new Promise(function(resolve){
    var done = false;
    var t = setTimeout(function(){ if (!done){ done = true; resolve(null); } }, ms);
    promise.then(function(v){ if (!done){ done = true; clearTimeout(t); resolve(v); } },
                 function(){ if (!done){ done = true; clearTimeout(t); resolve(null); } });
  });
}

window.addEventListener("error", function(e){
  state.error = "Erreur JS : " + (e && e.message ? e.message : "inconnue");
  try { render(); } catch(e2){}
});
window.addEventListener("unhandledrejection", function(e){
  var r = e && e.reason;
  var msg = r && (r.message || r.code) ? (r.code ? r.code + " — " : "") + (r.message || "") : String(r);
  state.error = "Erreur (promesse) : " + msg;
  try { render(); } catch(e2){}
});

function init(){
  db = makeLocalDb();
  LOCAL_MODE = true;
  sample = null;   // no AI import outside claude.ai
  assets = null;   // pictures are kept inside each project instead
  downloads = makeDownloads();
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
  subscribeProjects();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(e){ console.error("sw", e); });
}

init();
})();
